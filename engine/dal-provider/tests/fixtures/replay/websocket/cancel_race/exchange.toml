# Synthetic replay fixture for `websocket-cancel-race` of the provider layer
# behavior part (private spec `spec/parts/steps/provider-layer.md`, change 11
# and the `websocket-cancel-race` row). Authored from that retained
# obligation: a turn cancelled mid-stream closes its connection and is never
# reused, so a waiting second turn opens a new connection and never reads the
# first turn's frames. The first exchange blasts sixty distinct deltas; the
# test cancels after a fixed-seed observation count and the second exchange
# serves the clean turn. The harness has no per-frame pacing seam, so the
# fifty seeded points are consumer-side observation counts that vary task
# interleaving, not wire states; the no-contamination invariant is identical
# at every point. Never captured from a live API and never generated by the
# implementation under test.
[[exchange]]
kind = "websocket"

[exchange.request]
path = "/responses"
headers = { "openai-beta" = "responses_websockets=2026-02-06", "authorization" = "<redacted>", "chatgpt-account-id" = "<redacted>" }

[exchange.response]
frames = "storm.jsonl"

