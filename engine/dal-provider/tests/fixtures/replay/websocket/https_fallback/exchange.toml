# Synthetic replay fixture for `websocket-https-fallback` of the provider layer
# behavior part (private spec `spec/parts/steps/provider-layer.md`, change 11
# and the `websocket-https-fallback` row). Authored from that retained
# obligation: six refused handshakes latch the session fallback with the exact
# notice, the turn continues over HTTPS, the next same-model turn goes
# straight to HTTPS, and a model change tries WebSocket again. Each refused
# upgrade is a `websocket`-kind exchange with a plain 503 reply, served to
# the handshake request per the harness contract; the client maps it through
# `handshake_failure` exactly like a live refusal. Never captured from a live
# API and never generated by the implementation under test.
[[exchange]]
kind = "websocket"

[exchange.request]
path = "/responses"
headers = { "openai-beta" = "responses_websockets=2026-02-06", "authorization" = "<redacted>", "chatgpt-account-id" = "<redacted>" }

[exchange.response]
status = 503

