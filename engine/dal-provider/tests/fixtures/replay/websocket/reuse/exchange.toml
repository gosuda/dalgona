# Synthetic replay fixture for `websocket-reuse` of the provider layer behavior
# part (private spec `spec/parts/steps/provider-layer.md`, change 11 and the
# `websocket-reuse` row). Authored from that retained obligation: two turns on
# one session reuse one connection, and a model change rotates to a new one.
# One replay exchange is claimed per handshake, so both turns of the reused
# connection are scripted as consecutive frame steps of the first exchange
# (consumed stays 1); the post-model-change turn claims the second exchange
# (consumed becomes 2). Server event texts follow the Responses event grammar
# of change 10 as implemented in
# `engine/dal-provider/src/family/responses.rs`; the client frame is the
# `response.create` shape of change 11 derived from the documented body member
# order. Never captured from a live API and never generated by the
# implementation under test.
[[exchange]]
kind = "websocket"

[exchange.request]
path = "/responses"
headers = { "openai-beta" = "responses_websockets=2026-02-06", "authorization" = "<redacted>", "chatgpt-account-id" = "<redacted>" }

[exchange.response]
frames = "turns-1-and-2.jsonl"

[[exchange]]
kind = "websocket"

[exchange.request]
path = "/responses"
headers = { "openai-beta" = "responses_websockets=2026-02-06", "authorization" = "<redacted>", "chatgpt-account-id" = "<redacted>" }

[exchange.response]
frames = "turn-3.jsonl"
