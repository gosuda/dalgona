# Synthetic replay fixture for `websocket-limit-reconnect` of the provider layer
# behavior part (private spec `spec/parts/steps/provider-layer.md`, change 11
# and the `websocket-limit-reconnect` row). Authored from that retained
# obligation: `websocket_connection_limit_reached` before any event closes the
# connection and counts as a pre-event retry, so the turn reconnects and
# succeeds with two handshakes. Never captured from a live API and never
# generated by the implementation under test.
[[exchange]]
kind = "websocket"

[exchange.request]
path = "/responses"
headers = { "openai-beta" = "responses_websockets=2026-02-06", "authorization" = "<redacted>", "chatgpt-account-id" = "<redacted>" }

[exchange.response]
frames = "limit.jsonl"

[[exchange]]
kind = "websocket"

[exchange.request]
path = "/responses"
headers = { "openai-beta" = "responses_websockets=2026-02-06", "authorization" = "<redacted>", "chatgpt-account-id" = "<redacted>" }

[exchange.response]
frames = "success.jsonl"
