# Synthetic replay fixture for the direct Gemini API transport proof
# (ENG-03: the `google-generative-ai` family).
#
# Authored from the public `GenerateContent` grammar (the REST request body
# `contents` / `systemInstruction` / `tools[].functionDeclarations` /
# `generationConfig`, and the `streamGenerateContent?alt=sse` response of
# `candidates[].content.parts[]`, `finishReason`, and `usageMetadata`) and
# the dal adapter contract documented in
# `engine/dal-provider/src/family/google/gemini.rs` (key in `x-goog-api-key`,
# `POST {base}/models/{id}:streamGenerateContent?alt=sse`) and
# `engine/dal-provider/src/family/google/shared.rs` (flat body member order;
# tool schemas under `parametersJsonSchema`; `thinkingConfig` last inside
# `generationConfig`); never captured from a live API and never generated by
# the implementation under test. The configured base carries a `/v1beta`
# prefix like the built-in row default, so the path proves the prefix is
# kept. `request.json` is the hand-authored golden of the whole request body
# and is compared byte for byte; the key is the synthetic suite credential.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }
body = "request.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
