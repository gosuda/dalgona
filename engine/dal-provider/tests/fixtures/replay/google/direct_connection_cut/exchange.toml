# Synthetic replay fixture for the direct Gemini API connection cut after delivery over the `google-generative-ai` family.
#
# One exchange: HTTP 200 whose body writes one complete text chunk (207
# bytes) and 36 bytes of the next chunk, then the server aborts the
# connection mid-body (`close_after = 243`). The text is delivered before the
# transport fails, so the failure surfaces as the typed transport error and
# the lifecycle must not retry even though the suite configures stream
# retries: a retried request would need a second exchange this fixture does
# not have. Authored from the public `GenerateContent` stream grammar and the
# lifecycle contract documented in `engine/dal-provider/src/lifecycle.rs`
# (no retry after delivery) and `engine/dal-provider/src/provider/transport.rs`
# (a body read failure is the retryable transport truth, not a decoder cut);
# never captured from a live API and never generated by the implementation
# under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
close_after = 243
