# Synthetic replay fixture for the Antigravity (Cloud Code Assist) transport proof over the `google-antigravity` family.
#
# One exchange: `POST {base}/v1internal:streamGenerateContent?alt=sse` with
# the OAuth access token as `Authorization: Bearer` and the Antigravity
# `User-Agent` (`antigravity/hub/<version> (aidev_client; ...)`, which is not a
# `dalgon/` agent, so the fixture declares it exactly). The configured single
# base is honoured as the only endpoint. The response is the Cloud Code
# Assist stream: each SSE event wraps one `GenerateContent` response in a
# `response` member beside CCA bookkeeping (`traceId`). The request body is
# not compared: the envelope carries a random agent id, trajectory id, and
# wall-clock `requestId`, which no byte golden can fix (the envelope members
# are witnessed in-crate by `loopback_antigravity_posts_the_cca_envelope` and
# `google_antigravity_posts_the_cca_envelope`). Authored from the Antigravity
# adapter contract documented in
# `engine/dal-provider/src/family/google/antigravity.rs` and the public
# `GenerateContent` grammar; never captured from a live API and never
# generated by the implementation under test. The token is the synthetic
# suite credential.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1internal:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "authorization" = "Bearer ya29-synthetic-access", "user-agent" = "antigravity/hub/2.19.1 (aidev_client; os_type=darwin; arch=arm64; cl=963137146)" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
