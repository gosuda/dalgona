# Synthetic replay fixture for the direct Gemini API quota rejection
# (ENG-03: the `google-generative-ai` family).
#
# One exchange: HTTP 429 with a `google.rpc.Status` error body whose
# `details` carry a `google.rpc.ErrorInfo` with reason `QUOTA_EXHAUSTED` and
# a `google.rpc.QuotaFailure`. The suite configures retries, so a retried
# request would need a second exchange this fixture does not have: the proof
# that the failure is terminal quota is the typed error plus exactly one
# consumed exchange. Authored from the public Google API error model
# (`error.code` / `message` / `status` / `details[]` with `@type`) and the
# classifier contract documented in
# `engine/dal-provider/src/family/google/shared.rs` (`classify_http`: a 429
# or `RESOURCE_EXHAUSTED` carrying an account-exhaustion `ErrorInfo` reason
# is terminal quota); never captured from a live API and never generated by
# the implementation under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }

[exchange.response]
status = 429
headers = { "content-type" = "application/json" }
body = "response.json"
