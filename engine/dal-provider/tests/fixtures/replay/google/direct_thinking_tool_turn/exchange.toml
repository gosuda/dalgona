# Synthetic replay fixture for the direct Gemini API thought-signature round trip over the `google-generative-ai` family.
#
# Exchange one is the first turn: a thought part (carrying its own
# `thoughtSignature`, which replays via the `parts` carrier entry), then a
# `functionCall` part with a provider id and a `thoughtSignature` (which
# replays via the `calls` carrier entry), finishing `STOP`. Exchange two is
# the next turn: the stored assistant turn (thought text with its signature,
# the signed call) and the tool result go back, so `request-2.json` must carry
# the signature on both the thought part and the `functionCall` part and a
# `functionResponse` part in a following user turn.
# Authored from the public `GenerateContent` grammar (parts with `thought` and
# `thoughtSignature`, `functionCall` / `functionResponse`) and the dal adapter
# contract documented in `engine/dal-provider/src/family/google/shared.rs`
# (one `Replay` carrier `{"calls":{<id>:<signature>},"parts":[{kind, index,
# bytes, signature}]}` per response, bound to the producing family and model;
# Gemini 3 sends function-part ids); never
# captured from a live API and never generated by the implementation under
# test. Both request bodies are hand-authored goldens compared byte for byte.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }
body = "request-1.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response-1.sse"

[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }
body = "request-2.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response-2.sse"
