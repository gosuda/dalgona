# Synthetic replay fixture for the direct Gemini API connection cut before any event is delivered over the `google-generative-ai` family.
#
# Exchange one: HTTP 200 whose body is 69 bytes of an unfinished first chunk
# (no terminating blank line, so no event completes), then the server aborts
# the connection (`close_after = 69`). Nothing was delivered, so the
# lifecycle backs off and retries once. Exchange two answers the retry with a
# complete one-chunk turn. This is the counterpart of the cut-after-delivery
# fixtures: the same transport failure retries only while nothing has been
# delivered. Authored from the public `GenerateContent` stream grammar and
# the lifecycle contract documented in `engine/dal-provider/src/lifecycle.rs`;
# never captured from a live API and never generated by the implementation
# under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response-cut.sse"
close_after = 69

[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response-recovered.sse"
