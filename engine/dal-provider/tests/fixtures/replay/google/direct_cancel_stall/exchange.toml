# Synthetic replay fixture for the direct Gemini API mid-stream cancellation
# proof (ENG-03: the `google-generative-ai` family).
#
# The server writes the first complete text chunk (207 bytes) and then stalls
# with the socket open (`stall_after = 207`), so cancelling the turn must
# leave the consumer pending with no terminal event and must close the
# stalled transport. Authored from the public `GenerateContent` stream
# grammar and the cancellation contract documented in
# `engine/dal-provider/src/stream.rs` and `engine/dal-provider/src/lifecycle.rs`;
# never captured from a live API and never generated by the implementation
# under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
stall_after = 207
