# Synthetic replay fixture for the Antigravity account-verification
# rejection (ENG-03: the `google-antigravity` family).
#
# One exchange: HTTP 403 with a `google.rpc.Status` body whose `details` carry
# a `google.rpc.ErrorInfo` with reason `VALIDATION_REQUIRED` and the
# verification link in `metadata.validation_url`. The request side matches the
# Antigravity transport fixture (`antigravity_cca_turn`). Authored from the
# public Google API error model and the validation contract documented in
# `engine/dal-provider/src/family/google/antigravity.rs` (`validation_url`:
# the `details` entry whose reason is exactly `VALIDATION_REQUIRED`, URL in
# `metadata.validation_url`) and `engine/dal-provider/src/provider/request.rs`
# (`google_status_failure`: the fixed account-verification message); never
# captured from a live API and never generated by the implementation under
# test. The verification host is a reserved example domain; the URL is
# rendered, never fetched.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1internal:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "authorization" = "Bearer ya29-synthetic-access", "user-agent" = "antigravity/hub/2.19.1 (aidev_client; os_type=darwin; arch=arm64; cl=963137146)" }

[exchange.response]
status = 403
headers = { "content-type" = "application/json" }
body = "response.json"
