# Synthetic replay fixture for the direct Gemini API stream cut after delivery over the `google-generative-ai` family.
#
# One exchange: HTTP 200 whose body ends cleanly after one complete text
# chunk, with no `finishReason` anywhere. The decoder must end the turn with
# the typed `StreamCut` after delivering the text, and because text was
# already delivered the lifecycle must not retry even though the suite
# configures stream retries: a retried request would need a second exchange
# this fixture does not have. Authored from the public `GenerateContent`
# stream grammar (the terminal is the last `finishReason`) and the decoder
# contract documented in `engine/dal-provider/src/family/google/shared.rs`
# (`GeminiDecoder::end`: no `finishReason` is a cut) and
# `engine/dal-provider/src/lifecycle.rs` (a cut after delivery is final);
# never captured from a live API and never generated by the implementation
# under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1beta/models/gemini-3-pro:streamGenerateContent?alt=sse"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "x-goog-api-key" = "google-secret" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
