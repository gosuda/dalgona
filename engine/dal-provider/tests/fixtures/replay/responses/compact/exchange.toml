# Synthetic replay fixture for `responses-compact-test` of the provider
# layer behavior part (private spec `spec/parts/steps/provider-layer.md`,
# the `responses-compact-test` row: "`POST /v1/responses/compact` with a
# byte-equal body; the next turn input starts with the whole `output` array
# verbatim"). Authored from that retained obligation and the public compact
# adapter in `engine/dal-provider/src/compact/attempt.rs`, which preserves
# the request `model`, `instructions`, and every raw input value while
# omitting the ordinary Responses-only fields; never captured from a live
# API and never generated by the implementation under test. The replay
# server compares the compact request body byte for byte: `finish`
# succeeding is the byte-equality proof, and the test asserts the returned
# history items equal the served `output` array byte for byte.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/responses/compact"
headers = { "content-type" = "application/json", "accept" = "application/json", "authorization" = "<redacted>" }
body = "compact-request.json"

[exchange.response]
status = 200
headers = { "content-type" = "application/json" }
body = "compact-response.json"
