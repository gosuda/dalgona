# Synthetic replay fixture for the cancellation dimension of the Responses
# transport proof (private spec `spec/parts/steps/provider-layer.md`, change
# 8 harness verdict semantics: every replay test ends by asserting how many
# exchanges were consumed). The turn is cancelled before it opens, so the
# server must see no request at all: the verdict below is expected to report
# `replay incomplete: 0 of 1 exchanges consumed`. Authored from the public
# cancellation contract on `EventStream` and `Provider::open` in
# `engine/dal-provider/src/provider/api.rs` and `src/stream.rs`; never
# captured from a live API and never generated by the implementation under
# test. No `stall_after` timing trick is used: pre-open cancellation is fully
# deterministic, while the mid-stream stall observation belongs to the
# transport lane's `cancel-after-first-delta` row.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/responses"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "authorization" = "<redacted>" }
body = "request.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
