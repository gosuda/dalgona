# Synthetic replay fixture for `replay-not-cross-model` of the provider
# layer behavior part (private spec `spec/parts/steps/provider-layer.md`,
# the `replay-not-cross-model` row: "history with a Responses reasoning item
# from model A sent to model B drops it; sent to model A keeps it byte for
# byte"). Authored from that retained obligation and the public replay
# binding documented in `engine/dal-provider/src/family/responses.rs`; never
# captured from a live API and never generated by the implementation under
# test. Exchange 0 is the model-B turn whose body must not carry the
# reasoning item; exchange 1 is the model-A turn whose body must carry it
# verbatim. The replay server compares both bodies byte for byte.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/responses"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "authorization" = "<redacted>" }
body = "request-b.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"

[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/responses"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "authorization" = "<redacted>" }
body = "request-a.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
