# Synthetic replay fixture for `responses-turn` of the provider layer behavior
# part (private spec `spec/parts/steps/provider-layer.md`, change 10 and the
# `responses-turn` row). Authored from that retained obligation and the public
# Responses event grammar documented in
# `engine/dal-provider/src/family/responses.rs`; never captured from a live
# API and never generated by the implementation under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/responses"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "authorization" = "<redacted>" }
body = "request.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
