# Synthetic replay fixture for `responses-request-snapshot` of the provider
# layer behavior part (private spec `spec/parts/steps/provider-layer.md`,
# the `responses-request-snapshot` row: "Responses request with a replayed
# reasoning item; byte-equal with its fixture"). Authored from that retained
# obligation and the public body order documented in
# `engine/dal-provider/src/family/responses.rs`; never captured from a live
# API and never generated by the implementation under test. The replay
# server compares the request body byte for byte: `finish` succeeding is the
# byte-equality proof.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/responses"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "authorization" = "<redacted>" }
body = "request.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
