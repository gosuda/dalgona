# Synthetic replay fixture for the Anthropic OAuth wire-framing proof.
# The request must carry the bearer token as `authorization`, the two
# Claude Code betas first, the `x-app` marker, and the pinned Claude Code
# user-agent. The credential values stay `<redacted>` here; the exact
# synthetic-token and header-absence proofs live in `tests/replay_anthropic.rs`,
# which the shared replay server cannot express. Authored from the retained
# provider-layer obligations for the Anthropic family and the fingerprint
# documented in `engine/dal-provider/src/claude_fingerprint.rs`; never
# captured from a live API and never generated by the implementation under
# test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1/messages"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "anthropic-version" = "2023-06-01", "authorization" = "<redacted>", "anthropic-beta" = "claude-code-20250219,oauth-2025-04-20", "x-app" = "cli", "user-agent" = "claude-cli/2.1.280 (external, cli)" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
