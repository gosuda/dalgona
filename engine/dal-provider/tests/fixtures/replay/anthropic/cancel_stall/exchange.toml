# Synthetic replay fixture for the Anthropic mid-stream cancellation proof.
# The server writes the first three events (through the first text delta)
# and then stalls with the socket open, so cancelling the turn must leave
# the consumer pending with no terminal event. Authored from the retained
# provider-layer obligations for the Anthropic family and the cancellation
# contract documented in `engine/dal-provider/src/stream.rs`; never captured
# from a live API and never generated by the implementation under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1/messages"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "anthropic-version" = "2023-06-01", "x-api-key" = "<redacted>" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
stall_after = 390
