# Synthetic replay fixture for the Anthropic usage-accumulation proof.
# Authored from the retained provider-layer obligations for the Anthropic
# family (`message_start` input overwritten by each later usage member:
# input 25, output 15 then 891) and the public stream grammar documented in
# `engine/dal-provider/src/family/anthropic.rs`; never captured from a live
# API and never generated by the implementation under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1/messages"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "anthropic-version" = "2023-06-01", "x-api-key" = "<redacted>" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
