# Synthetic replay fixture for the Anthropic native tool-search session proof.
# Exchange one is the first turn of a model that supports tool references: the
# request lists `read`, the native search server tool, and two deferred tools
# with `defer_loading`, and the response holds a `server_tool_use` search call,
# its `tool_search_tool_result` with `tool_reference` members (plus members
# the decoder does not name), and a `tool_use` of the discovered tool.
# Exchange two is the next turn: the discovered tool now loads up front, one
# tool stays deferred, and the stored search pair travels back untouched
# beside the `tool_use`. Authored from Anthropic's tool-search documentation
# (https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool)
# and the request lowering documented in
# `engine/dal-provider/src/family/anthropic.rs`; never captured from a live
# API and never generated by the implementation under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1/messages"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "anthropic-version" = "2023-06-01", "x-api-key" = "<redacted>" }
body = "request-1.json"

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response-1.sse"

