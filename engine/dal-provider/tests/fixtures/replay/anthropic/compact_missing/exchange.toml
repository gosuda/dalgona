# Synthetic replay fixture for an Anthropic remote compaction response that
# omits its compaction block. The public Provider::compact path must preserve
# the typed missing-block error and its exact rendered message.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1/messages"
headers = { "content-type" = "application/json", "accept" = "application/json", "anthropic-version" = "2023-06-01", "anthropic-beta" = "compact-2026-09-04", "x-api-key" = "<redacted>" }
body = "compact-request.json"

[exchange.response]
status = 200
headers = { "content-type" = "application/json" }
body = "compact-response.json"
