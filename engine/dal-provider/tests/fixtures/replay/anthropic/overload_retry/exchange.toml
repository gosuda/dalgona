# Synthetic replay fixture for the Anthropic overload retry-boundary proof.
# The first exchange carries an in-stream `overloaded_error` before any
# neutral event reaches the consumer, so the lifecycle retries once; the
# second exchange succeeds. Authored from the retained provider-layer
# obligations for the Anthropic family and the retry table documented in
# `engine/dal-provider/src/retry.rs`; never captured from a live API and
# never generated by the implementation under test.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1/messages"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "anthropic-version" = "2023-06-01", "x-api-key" = "<redacted>" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "error.sse"

[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/v1/messages"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "anthropic-version" = "2023-06-01", "x-api-key" = "<redacted>" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "recovered.sse"
