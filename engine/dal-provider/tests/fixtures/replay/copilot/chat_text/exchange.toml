# Synthetic replay fixture for the GitHub Copilot Chat transport proof
#
# Authored from the Copilot adapter contract documented in
# `engine/dal-provider/src/family/copilot.rs` (Chat surface path
# `chat/completions`; bearer authorization plus the announced
# `copilot-integration-id` identity; a configured loopback base is kept)
# and the public Chat stream grammar in
# `engine/dal-provider/src/family/chat.rs`; never captured from a live API
# and never generated by the implementation under test. The response body
# reuses the synthetic Chat text-turn bytes, proving the Chat decoder reads
# the Copilot framing.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/chat/completions"
headers = { "content-type" = "application/json", "authorization" = "<redacted>", "copilot-integration-id" = "copilot-chat", "user-agent" = "copilot/1.0.82" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
