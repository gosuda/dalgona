# Synthetic replay fixture for the Azure OpenAI Chat transport proof
# (ENG-02: Azure route lowering over the Chat family).
#
# Authored from the Azure adapter contract documented in
# `engine/dal-provider/src/family/azure.rs` (`chat_target`: a loopback base
# keeps its authority and gains the `deployments/<deployment>` segment with
# the `api-version` query; the key travels in the `api-key` header) and the
# public Chat stream grammar in `engine/dal-provider/src/family/chat.rs`;
# never captured from a live API and never generated by the implementation
# under test. The server compares method, path plus query, and the listed
# headers only: a difference answers 418 and fails `finish`, so a green
# `finish` is the routing proof. The response body reuses the synthetic
# Chat text-turn bytes, proving the Chat decoder reads the Azure framing.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/deployments/gpt-6-astra/chat/completions?api-version=2024-10-21"
headers = { "content-type" = "application/json", "api-key" = "<redacted>" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
