# Synthetic replay fixture for the Azure OpenAI Responses transport proof
#
# Authored from the Azure adapter contract documented in
# `engine/dal-provider/src/family/azure.rs` (`responses_base`: a non-Azure
# loopback base is kept as-is; the `api-version` query joins the Responses
# path; the key travels in the `api-key` header) and the public Responses
# stream grammar in `engine/dal-provider/src/family/responses.rs`; never
# captured from a live API and never generated by the implementation under
# test. The response body reuses the synthetic Responses canonical-turn
# bytes (reasoning summary, text, one function call), proving the Responses
# decoder reads the Azure framing.
[[exchange]]
kind = "http"

[exchange.request]
method = "POST"
path = "/responses?api-version=v1"
headers = { "content-type" = "application/json", "accept" = "text/event-stream", "api-key" = "<redacted>" }

[exchange.response]
status = 200
headers = { "content-type" = "text/event-stream" }
body = "response.sse"
