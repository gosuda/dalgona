[workspace]
resolver = "3"
members = [
    "core/dal-core",
    "engine/dal-agent",
    "engine/dal-provider",
    "engine/dal-store",
    "extensions/dal-ext",
    "extensions/dal-star",
    "extensions/dal-tools",
    "clients/dal-tui",
    "clients/dal-wire",
    "cli/dalgon",
    "gates",
    "dalgona/dalgona",
    "dalgona/dalgona-batteries",
    "dalgona/gates",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"
repository = "https://github.com/gosuda/dalgona"

[workspace.dependencies]
allocative = "=0.3.6"
blake3 = "=1.8.2"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive", "rc"] }
sonic-rs = "=0.5.10"
shuttle = "=0.9.8"
thiserror = "=2.0.21"
uuid = { version = "=1.28.0", features = ["v7"] }
jiff = { version = "=0.2.38", features = ["serde"] }
toml = "=1.1.8"
toml_edit = "=0.25.17"
proptest = "=1.12.0"
png = "=0.18.1"
unicode-width = "=0.2.2"
unicode-segmentation = { version = "=1.13.3", default-features = false }
tracing = "=0.1.44"
futures = "=0.3.34"
reqwest = { version = "=0.13.5", features = ["rustls", "json", "stream"] }
url = "=2.5.8"
globset = "=0.4.20"
regex-automata = "=0.4.18"
tempfile = "=3.27.0"
tokio = "=1.54.1"
tokio-util = "=0.7.20"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
base64 = "=0.23.1"
hyper = "=1.12.0"
hyper-util = "=0.1.21"
bytes = "=1.12.1"
sha2 = "=0.11.1"
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend", "runtime_detection"] }
hmac = "=0.13.0"
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
quick-xml = { version = "=0.42.0", default-features = false }
regex = "=1.13.1"
process-wrap = { version = "=10.0.1", features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
rustix = { version = "=1.1.5", features = ["process"] }
landlock = "=0.4.7"
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }
similar = "=3.2.0"
dal-core = { path = "core/dal-core", version = "=0.1.0" }
dal-agent = { path = "engine/dal-agent", version = "=0.1.0" }
dal-provider = { path = "engine/dal-provider", version = "=0.1.0" }
dal-store = { path = "engine/dal-store", version = "=0.1.0" }
dal-ext = { path = "extensions/dal-ext", version = "=0.1.0" }
dal-star = { path = "extensions/dal-star", version = "=0.1.0" }
dal-tools = { path = "extensions/dal-tools", version = "=0.1.0" }
dal-tui = { path = "clients/dal-tui", version = "=0.1.0" }
dal-wire = { path = "clients/dal-wire", version = "=0.1.0" }
dalgon = { path = "cli/dalgon", version = "=0.1.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
exit = "deny"
disallowed_methods = "deny"

# Fast feedback for dev profile
[profile.dev]
debug     = "limited"

# Bypass the heavy linker for DWARF debug info (macOS/Linux).
# Keeps debug info in object files instead of packing it into the binary.
split-debuginfo = "unpacked"

# Increase optimization slightly
# Setting this to 1 can sometimes make the compiler generate cleaner code 
# that LLVM backend can process faster, without doing heavy optimizations.
opt-level = 1

# Fast feedback for test profile
[profile.test]
opt-level = 3
debug     = "limited"
split-debuginfo = "unpacked"

[profile.dist]
inherits = "release"
