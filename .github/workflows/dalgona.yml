name: dalgona
on:
  push:
    paths:
      - "core/**"
      - "engine/**"
      - "extensions/**"
      - "clients/**"
      - "cli/**"
      - "gates/**"
      - "dalgona/**"
      - "prices/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist-workspace.toml"
      - "clippy.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "scripts/**"
      - ".github/workflows/dalgona.yml"
      - "rust-toolchain.toml"
      - ".gitignore"
      - "LICENSE.md"
      - "AGENTS.md"
      - "README.md"
  pull_request:
    paths:
      - "core/**"
      - "engine/**"
      - "extensions/**"
      - "clients/**"
      - "cli/**"
      - "gates/**"
      - "dalgona/**"
      - "prices/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist-workspace.toml"
      - "clippy.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "scripts/**"
      - ".github/workflows/dalgona.yml"
      - "rust-toolchain.toml"
      - ".gitignore"
      - "LICENSE.md"
      - "AGENTS.md"
      - "README.md"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: cargo fmt --check --package dalgona --package dalgona-batteries --package dalgona-gates

  gates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: cargo clippy --package dalgona --package dalgona-batteries --package dalgona-gates --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --package dalgona --package dalgona-batteries --package dalgona-gates --all-targets --locked -- -D warnings
      - run: cargo check --package dalgona --package dalgona-batteries --package dalgona-gates --locked --no-default-features
      - run: cargo test --package dalgona --package dalgona-batteries --all-features --locked
      - run: cargo test --package dalgona-gates --lib --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@latest
      - run: cargo deny --locked check
