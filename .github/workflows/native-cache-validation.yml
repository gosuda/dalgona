name: Protected Go verification

on:
  push:
    branches: [ci/native-cache-validation-20261126]
    paths: [.github/workflows/native-cache-validation.yml]

permissions:
  contents: read

env:
  GOENV: "off"
  GOCACHEPROG: ""
  GOPROXY: https://proxy.golang.org|https://goproxy.io|direct

jobs:
  desktop-windows:
    permissions:
      contents: read
    runs-on: depot-windows-2025-8
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          NODE_OPTIONS: '--require ./.github/actions/go-cache-paths/isolate.cjs'
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve Go cache paths
        id: cache_paths
        uses: ./.github/actions/go-cache-paths
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache_paths.outputs.build }}
            ${{ steps.cache_paths.outputs.module }}
            ${{ runner.temp }}/golangci-lint
          key: go-v2-${{ github.ref }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-v2-${{ github.ref }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Validate MSI inputs without signing
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $script = (Resolve-Path 'deploy/desktop/package-windows.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          [xml] $manifest = Get-Content -Raw 'deploy/desktop/dalgona.wxs'
          $package = $manifest.Wix.Package
          if ($manifest.DocumentElement.NamespaceURI -ne 'http://wixtoolset.org/schemas/v4/wxs' -or
              $package.Scope -ne 'perMachine' -or [int]$package.InstallerVersion -lt 500) {
              throw 'The MSI manifest must declare the WiX schema, per-machine scope and installer version >= 500.'
          }
      - name: Static GUI proof
        run: |
          unset GOCACHEPROG
          just desktop-check-static
      - name: Native GUI execution proof
        run: |
          unset GOCACHEPROG
          just desktop-check-gui
      - name: Build the desktop binary
        run: |
          unset GOCACHEPROG
          just desktop-build


  verify-linux:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        env:
          NODE_OPTIONS: '--require ./.github/actions/go-cache-paths/isolate.cjs'
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache-paths
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.9"
          python-version: "3.15"
          require-checksums: true
          enable-cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      - name: Install native build packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev libegl1-mesa-dev libgles2-mesa-dev libvulkan-dev libffi-dev pkg-config
      - name: Build locked web assets
        run: |
          unset GOCACHEPROG
          corepack enable
          corepack prepare "$(node -p 'require("./web/package.json").packageManager')" --activate
          just web
      - name: Run the required repository gate
        run: |
          unset GOCACHEPROG
          test -z "$(go env GOCACHEPROG)"
          just verify
