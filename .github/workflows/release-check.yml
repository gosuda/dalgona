name: release-check
on:
  pull_request:
    paths:
      - "dal/**"
      - "dalgona/**"
      - "scripts/**"
      - ".github/workflows/dalgon-release.yml"
      - ".github/workflows/dalgona-release.yml"
      - ".github/workflows/release-check.yml"
jobs:
  dist-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cargo install cargo-dist --version 0.32.0 --locked
      - working-directory: dal
        run: dist plan
      - working-directory: dalgona
        run: dist plan
  semver-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: cargo install cargo-semver-checks --version 0.50.0 --locked
      - run: bash scripts/semver-gate.sh dal
      - run: bash scripts/semver-gate.sh dalgona
