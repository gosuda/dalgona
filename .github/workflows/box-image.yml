name: "Box image"

"on":
  push:
    tags:
      - "v*"
permissions:
  contents: "read"
  packages: "write"
  attestations: "write"
  id-token: "write"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  publish:
    name: "Publish the box image"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: "Set up just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: "Build the binaries"
        run: "just dist"
      - name: "Set up Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: "Log in to GHCR"
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: "Build and push"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "."
          file: "deploy/box/Dockerfile"
          platforms: "linux/amd64,linux/arm64"
          push: "true"
          tags: |
            ghcr.io/gosuda/dalgona-box:${{ github.ref_name }}
            ghcr.io/gosuda/dalgona-box:${{ github.sha }}
            ghcr.io/gosuda/dalgona-box:latest
          provenance: "mode=max"
          sbom: "true"
          labels: "org.opencontainers.image.source=https://github.com/gosuda/dalgona"
