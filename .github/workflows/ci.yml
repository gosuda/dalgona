name: CI

"on":
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

env:
  GOPROXY: https://proxy.golang.org|https://goproxy.io|direct

jobs:
  lint:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go tool golangci-lint fmt --diff
      - run: go vet ./...
      - run: go tool golangci-lint run ./...

  test:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race -count=1 ./...

  vuln:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go tool govulncheck ./...

  web:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Corepack pnpm
        id: corepack
        run: corepack enable && corepack prepare pnpm@12.21.0 --activate && pnpm --version
      - name: Hashline model
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 docs/dal/spec/hashline/verify_model.py | cmp - docs/dal/spec/hashline/verification.json
      - name: Spec style
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 docs/dal/spec/check_style.py docs/dal/spec
      - name: Dalgona spec style
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 docs/dal/spec/check_style.py docs/dalgona/spec
      - name: Spec style tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 docs/dal/spec/check_style_test.py
      - name: Docs links
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 docs/check_links.py
      - name: Web install
        id: web-install
        if: ${{ !cancelled() && steps.corepack.outcome == 'success' }}
        run: pnpm -C web install --frozen-lockfile
      - name: Web build
        id: web-build
        if: ${{ !cancelled() && steps.web-install.outcome == 'success' }}
        run: pnpm -C web build
      - name: Web lint
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm -C web exec biome ci
      - name: Web typecheck
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm -C web exec svelte-check
      - name: Web tests
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm -C web exec vitest run
      - name: Worker install
        id: worker-install
        if: ${{ !cancelled() && steps.corepack.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare install --frozen-lockfile
      - name: Worker typecheck
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare exec tsc --noEmit
      - name: Worker test typecheck
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare exec tsc --noEmit -p tsconfig.test.json
      - name: Worker lint
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare exec biome ci .
      - name: Worker tests
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare test
