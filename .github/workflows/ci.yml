name: CI

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org|https://goproxy.io|direct

jobs:
  lint:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go tool golangci-lint fmt --diff
      - run: go vet ./...
      - run: go tool golangci-lint run ./...

  test:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
      - run: go test -race -count=1 ./...

  vuln:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go tool govulncheck ./...

  desktop:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Record native target
        run: 'echo "native execution: $(go env GOOS)/$(go env GOARCH) CGO_ENABLED=$(go env CGO_ENABLED)"'
      - name: Gio Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libxfixes-dev libvulkan-dev
      - name: Install just 1.59.0
        run: |
          curl -fsSLo /tmp/just.tar.gz https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          echo "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  /tmp/just.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
      - run: just desktop-check
      - run: just desktop-build

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Record native target
        run: 'echo "native execution: $(go env GOOS)/$(go env GOARCH) CGO_ENABLED=$(go env CGO_ENABLED)"'
      - name: Validate DMG inputs without signing
        run: |
          bash -n deploy/desktop/package-macos.sh
          plutil -lint deploy/desktop/Info.plist
          if output=$(env -u DALGONA_MACOS_SIGN_IDENTITY -u DALGONA_MACOS_NOTARY_PROFILE just desktop-package 2>&1); then
            printf '%s\n' 'desktop-package accepted missing macOS signing inputs' >&2
            exit 1
          fi
          grep -F 'set DALGONA_MACOS_SIGN_IDENTITY' <<<"$output"
      - run: just desktop-check
      - run: just desktop-build

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Record native target
        run: 'echo "native execution: $(go env GOOS)/$(go env GOARCH) CGO_ENABLED=$(go env CGO_ENABLED)"'
      - name: Validate MSI inputs without signing
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $script = (Resolve-Path 'deploy/desktop/package-windows.ps1').Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          [xml] $manifest = Get-Content -Raw 'deploy/desktop/dalgona.wxs'
          $package = $manifest.Wix.Package
          if ($manifest.DocumentElement.NamespaceURI -ne 'http://wixtoolset.org/schemas/v4/wxs' -or
              $package.Scope -ne 'perMachine' -or [int]$package.InstallerVersion -lt 500) {
              throw 'The MSI manifest must declare the WiX schema, per-machine scope and installer version >= 500.'
          }
      - run: just desktop-check
      - run: just desktop-build

  web:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Corepack pnpm
        id: corepack
        run: corepack enable && corepack prepare pnpm@12.21.0 --activate && pnpm --version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        id: setup-uv
        with:
          python-version: "3.15"
      - name: Hashline model
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup-uv.outcome == 'success' }}
        run: uv run --no-project --python 3.15 docs/dal/spec/hashline/verify_model.py | cmp - docs/dal/spec/hashline/verification.json
      - name: Spec style
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup-uv.outcome == 'success' }}
        run: uv run --no-project --python 3.15 docs/dal/spec/check_style.py docs/dal/spec
      - name: Dalgona spec style
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup-uv.outcome == 'success' }}
        run: uv run --no-project --python 3.15 docs/dal/spec/check_style.py docs/dalgona/spec
      - name: Spec style tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup-uv.outcome == 'success' }}
        run: uv run --no-project --python 3.15 docs/dal/spec/check_style_test.py
      - name: Docs links
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 docs/check_links.py
      - name: Web install
        id: web-install
        if: ${{ !cancelled() && steps.corepack.outcome == 'success' }}
        run: pnpm -C web install --frozen-lockfile
      - name: Web build
        id: web-build
        if: ${{ !cancelled() && steps.web-install.outcome == 'success' }}
        run: pnpm -C web build
      - name: Web lint
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm -C web exec biome ci
      - name: Web typecheck
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm -C web exec svelte-check
      - name: Web tests
        if: ${{ !cancelled() && steps.web-build.outcome == 'success' }}
        run: pnpm -C web exec vitest run
      - name: Worker install
        id: worker-install
        if: ${{ !cancelled() && steps.corepack.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare install --frozen-lockfile
      - name: Worker typecheck
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare exec tsc --noEmit
      - name: Worker test typecheck
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare exec tsc --noEmit -p tsconfig.test.json
      - name: Worker lint
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare exec biome ci .
      - name: Worker tests
        if: ${{ !cancelled() && steps.worker-install.outcome == 'success' }}
        run: pnpm -C deploy/cloudflare test
      - name: Upload web dist
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/dalgona/webui/dist
          include-hidden-files: true
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  verify-native:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    needs: web
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require web assets
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ needs.web.result }}" != "success" ]; then
            echo "web job ${{ needs.web.result }}; refusing Go verification without the built web assets" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: internal/dalgona/webui/dist
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.15"
      - run: go tool golangci-lint fmt --diff
      - run: go vet ./...
      - run: go tool golangci-lint run ./...
      - run: go test -race -count=1 ./...
      - run: go tool govulncheck ./...
