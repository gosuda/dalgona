name: "CI"

"on":
  push:
    branches:
      - "main"
    tags:
      - "**"
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  shared:
    name: "Shared checks"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Set up Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: "Set up pnpm"
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: "web/package.json"
          cache: true
          cache_dependency_path: |
            web/pnpm-lock.yaml
            deploy/cloudflare/pnpm-lock.yaml
      - name: "Set up just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: "Set up uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: "Build the web UI"
        run: "just web"
      - name: "Verify shared checks"
        run: "just verify-shared"
      - name: "Upload the web UI"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "web-ui"
          path: "internal/dalgona/webui/dist"
          include-hidden-files: true
          if-no-files-found: "error"
          retention-days: 7
          overwrite: true

  verify:
    name: "Verify (${{ matrix.os }})"
    needs: "shared"
    if: "${{ !cancelled() }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
    steps:
      - name: "Require shared checks"
        if: "${{ needs.shared.result != 'success' }}"
        shell: bash
        run: |
          echo "::error::Shared checks did not pass."
          exit 1
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Download the web UI"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: "web-ui"
          path: "internal/dalgona/webui/dist"
      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: "Set up just"
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: "Set up uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
      - name: "Verify Go"
        run: "just verify-go"
