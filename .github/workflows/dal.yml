name: dal
on:
  push:
    paths:
      - "core/**"
      - "engine/**"
      - "extensions/**"
      - "clients/**"
      - "cli/**"
      - "gates/**"
      - "dalgona/**"
      - "prices/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist-workspace.toml"
      - "clippy.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "scripts/**"
      - ".github/workflows/dal.yml"
      - "rust-toolchain.toml"
      - ".gitignore"
      - "LICENSE.md"
      - "AGENTS.md"
      - "README.md"
  pull_request:
    paths:
      - "core/**"
      - "engine/**"
      - "extensions/**"
      - "clients/**"
      - "cli/**"
      - "gates/**"
      - "dalgona/**"
      - "prices/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist-workspace.toml"
      - "clippy.toml"
      - "rustfmt.toml"
      - "deny.toml"
      - "scripts/**"
      - ".github/workflows/dal.yml"
      - "rust-toolchain.toml"
      - ".gitignore"
      - "LICENSE.md"
      - "AGENTS.md"
      - "README.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: cargo fmt --check --package dal-core --package dal-agent --package dal-provider --package dal-store --package dal-ext --package dal-star --package dal-tools --package dal-tui --package dal-wire --package dalgon --package dal-gates

  prices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: python3 -B scripts/test_update_prices.py
      - run: python3 -B scripts/update-prices.py --check

  gates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - name: Report the file-descriptor ceiling
        if: runner.os == 'macOS'
        run: |
          ulimit -Sn; ulimit -Hn
          sysctl kern.maxfiles kern.maxfilesperproc || true
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-semver-checks@latest
      - run: cargo clippy --workspace --exclude dalgona --exclude dalgona-batteries --exclude dalgona-gates --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --exclude dalgona --exclude dalgona-batteries --exclude dalgona-gates --all-targets --locked -- -D warnings
      - run: cargo check --workspace --exclude dalgona --exclude dalgona-batteries --exclude dalgona-gates --locked --no-default-features
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-dist@latest
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-auditable@latest
      - run: cargo test --workspace --exclude dalgona --exclude dalgona-batteries --exclude dalgona-gates --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@latest
      - run: cargo deny --locked check

  stress-budgets:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      DAL_TIMING_BUDGETS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: cargo test --locked -p dal-gates --release -- stress_
