on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

jobs:
  publish-crates:
    if: fromJson(inputs.plan).releases[0].app_name == 'dalgon' && fromJson(inputs.plan).releases[1] == null
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - name: Publish dalgon crates in dependency order
        run: bash scripts/publish-crates.sh --product dal .
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
