name: dalgona-gates
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  functional:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - run: cargo build --locked -p dalgona --bin dalgona
      - run: cargo build --locked --release -p dalgona --bin dalgona
      - run: cargo test --locked -p dalgona-gates --test dalgona-boot-01 --test dalgona-boot-02 --test dalgona-boot-03 --test dalgona-boot-04 --test dalgona-boot-05 --test dalgona-boot-06 --test dalgona-boot-07 --test dalgona-boot-08 --test dalgona-boot-09 --test dalgona-boot-10 --test dalgona-boot-11 --test dalgona-boot-12 --test dalgona-workspace-graph
      - run: cargo test --locked -p dalgona-gates --release --test dalgona-orchestration-01 --test dalgona-orchestration-02 --test dalgona-orchestration-03 --test dalgona-orchestration-04 --test dalgona-orchestration-05 --test dalgona-orchestration-06 --test dalgona-orchestration-07 --test dalgona-orchestration-08 --test dalgona-orchestration-09 --test dalgona-orchestration-10
      - run: cargo test --locked -p dalgona-gates --test dalgona-batteries-01 --test dalgona-batteries-02 --test dalgona-batteries-03 --test dalgona-batteries-04 --test dalgona-batteries-05 --test dalgona-batteries-06 --test dalgona-batteries-07 --test dalgona-batteries-08 --test dalgona-batteries-09 --test dalgona-batteries-10 --test dalgona-batteries-11 --test dalgona-batteries-12 --test dalgona-batteries-13 --test dalgona-batteries-14 --test dalgona-batteries-15 --test dalgona-batteries-16 --test dalgona-batteries-17 --test dalgona-batteries-18 --test dalgona-batteries-19 --test dalgona-assembly-01
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-dist@latest
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-semver-checks@latest
      - run: cargo test --locked -p dalgona-gates --test dalgona-release-01 --test dalgona-release-02 --test dalgona-release-03 --test dalgona-release-04 --test dalgona-release-05 --test dalgona-release-06 --test dalgona-release-07 --test dalgona-release-08 --test dalgona-release-09 --test dalgona-release-13 --test dalgona-release-14 --test dalgona-release-15 --test dalgona-release-16 --test dalgona-release-17 --test dalgona-release-18 --test dalgona-release-19 --test dalgona-release-20
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny@latest
      - run: cargo deny --locked check
  released-artifacts:
    if: startsWith(github.ref_name, 'dalgona-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - name: Check exact Dalgona package and release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#dalgona-v}"
          test "$GITHUB_REF_NAME" = "dalgona-v$version"
          curl -fsSL "https://index.crates.io/da/lg/dalgona" | grep -F "\"vers\":\"$version\""
          curl -fsSL -o /dev/null "https://github.com/gosuda/dalgona/releases/download/${GITHUB_REF_NAME}/dalgona-installer.sh"
      - run: cargo test --locked -p dalgona-gates --test dalgona-release-10 --test dalgona-release-11 --test dalgona-release-12
  stress-budgets:
    # Minutes-long scale suite: explicit targets with the workload opt-in.
    # The suite also compiles and passes quietly inside the functional lane
    # above, where DALGONA_ORCH_STRESS is unset. Wall-clock bounds hold only
    # on the nightly idle-machine lane (schedule, workflow_dispatch); shared
    # push/PR runners cannot hold them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: rustup update stable --no-self-update
      - name: Stress scenarios (one process each, marker proof)
        shell: bash
        run: |
          set -euo pipefail
          export DALGONA_ORCH_STRESS=1
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export DAL_TIMING_BUDGETS=1
          fi
          # One filtered process per scenario: peaks stay attributable, and
          # the marker grep proves the scenario ran instead of skipping.
          run_scenario() {
            log="$(mktemp)"
            cargo test --locked -p dalgona-gates --release \
              --test "$1" "$2" -- --nocapture --exact 2>&1 | tee "$log"
            grep -F "stress-scenario-ok: $3" "$log"
          }
          run_scenario dalgona-orchestration-09 stress_500_pool_items_finish_within_the_process_contract scale500
          run_scenario dalgona-orchestration-09 stress_v9_silent_and_throttled_over_loopback_provider v9-loopback
          run_scenario dalgona-orchestration-10 exec_jobs_and_monitors_end_clean_within_the_process_contract held200
          run_scenario dalgona-orchestration-10 fake_clock_sleep_detach_one_hundred_jobs fake-clock100
          run_scenario dalgona-orchestration-10 subagent_exec_cancel_kills_every_process_tree cancel-20x10
          run_scenario dalgona-orchestration-10 parent_fast_jobs_complete_and_deliver_once fast200
