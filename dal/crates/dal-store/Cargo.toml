[package]
name = "dal-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Durable session journals, blobs, and locks for dal"
publish = true
include = ["/src"]
autotests = false

[dependencies]
blake3.workspace = true
dal-core = { path = "../dal-core", version = "0.1.0" }
jiff.workspace = true
serde.workspace = true
sonic-rs.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
unicode-segmentation.workspace = true
uuid = { workspace = true, features = ["v4"] }
[dev-dependencies]
proptest.workspace = true
[[test]]
name = "id"
path = "tests/id.rs"

[[test]]
name = "record"
path = "tests/record.rs"

[[test]]
name = "blob"
path = "tests/blob.rs"

[[test]]
name = "journal"
path = "tests/journal.rs"

[[test]]
name = "repair"
path = "tests/repair.rs"

[[test]]
name = "list"
path = "tests/list.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "lock"
path = "tests/lock.rs"

[[test]]
name = "model"
path = "tests/model.rs"

[[test]]
name = "shuttle"
path = "tests/shuttle.rs"

[[test]]
name = "kill"
path = "tests/kill.rs"
[[bin]]
name = "append-child"
path = "tests/support/append_child.rs"
test = false
bench = false

[[bench]]
name = "store"
path = "tests/bench.rs"
harness = false

[package.metadata.dist]
dist = false

[lints]
workspace = true
