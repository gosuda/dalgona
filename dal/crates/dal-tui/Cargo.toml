[package]
name = "dal-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = true
description = "Terminal front end for dal over the Host/Agent seam"

[dependencies]
dal-core.workspace = true
dal-agent.workspace = true
ratatui = "=0.30.2"
crossterm = "=0.29.0"
ratatui-textarea = "=0.9.3"
tui-markdown = "=0.3.10"
opaline = { version = "=0.4.2", default-features = false, features = ["builtin-themes", "ratatui"] }
ratatui-image = { version = "=11.1.0", default-features = false, features = ["crossterm"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
resvg = "=0.48.1"
tiny-skia = "=0.12.0"
png.workspace = true
mermaid-text = "=0.57.0"
layout-rs = "=0.1.3"
base64.workspace = true
blake3.workspace = true
rustix = { workspace = true, features = ["event", "stdio"] }
unicode-width.workspace = true
unicode-segmentation.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
futures.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
insta = "=1.49.0"
proptest.workspace = true

[lints]
workspace = true
