[advisories]
version = 2
ignore = [
    # starlark is the scripting engine; its transitive unmaintained deps cannot
    # be removed without dropping the feature. No known vulnerabilities.
    "RUSTSEC-2023-0089", # atomic-polyfill via starlark
    "RUSTSEC-2024-0388", # derivative via starlark
    "RUSTSEC-2024-0436", # paste via starlark
    "RUSTSEC-2025-0057", # fxhash via starlark_map
]
[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "SUL-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
