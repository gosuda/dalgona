[package]
name = "gates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
autobins = false
autoexamples = false
autobenches = false
autotests = false

[lib]

[lints]
workspace = true

[dev-dependencies]
dal-core = { path = "../crates/dal-core" }
dal-store = { path = "../crates/dal-store" }
dal-provider = { path = "../crates/dal-provider" }
dal-agent = { path = "../crates/dal-agent" }
dal-tools = { path = "../crates/dal-tools", features = ["symbols"] }
dal-ext = { path = "../crates/dal-ext" }
dal-star = { path = "../crates/dal-star" }
dal-tui = { path = "../crates/dal-tui" }
dal-wire = { path = "../crates/dal-wire" }
dalgon = { path = "../crates/dalgon", default-features = false }
futures = { workspace = true }
insta = "=1.48.0"
proptest = { workspace = true }
ratatui = "=0.30.2"
shuttle = "=0.9.4"
serde = { workspace = true }
tempfile = { workspace = true }
sonic-rs = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
rustix = { workspace = true, features = ["pty", "termios"] }
unicode-width = { workspace = true }

