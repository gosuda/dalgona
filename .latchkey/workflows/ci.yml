name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

latchkey:
  schema: 1

env:
  GOPROXY: https://proxy.golang.org|https://goproxy.io|direct

jobs:
  lint:
    runs-on: small
    timeout-minutes: 30
    steps:
      - uses: latchkey/cache-restore@1.1.0
        with:
          key: lint
          version: go2
          hash-files: go.sum
          into: "~"
      - run: go tool golangci-lint fmt --diff
      - run: go vet ./...
      - run: go tool golangci-lint run ./...
      - if: env.LATCHKEY_CI_EVENT_CLASS == 'branch_push'
        uses: latchkey/cache-save@1.1.0
        with:
          key: lint
          version: go2
          hash-files: go.sum
          from: "~"
          path: .cache/go-build go/pkg/mod

  test:
    runs-on: small
    timeout-minutes: 30
    steps:
      - uses: latchkey/cache-restore@1.1.0
        with:
          key: test
          version: go2
          hash-files: go.sum
          into: "~"
      - run: go test -race -count=1 ./...
      - if: env.LATCHKEY_CI_EVENT_CLASS == 'branch_push'
        uses: latchkey/cache-save@1.1.0
        with:
          key: test
          version: go2
          hash-files: go.sum
          from: "~"
          path: .cache/go-build go/pkg/mod

  vuln:
    runs-on: small
    timeout-minutes: 15
    steps:
      - run: go tool govulncheck ./...

  web:
    runs-on: small
    timeout-minutes: 20
    steps:
      - uses: latchkey/setup-node@1.0.1
        with:
          node-version: 24
      - name: Docs and specs
        run: |
          python3 docs/dal/spec/hashline/verify_model.py | cmp - docs/dal/spec/hashline/verification.json
          python3 docs/dal/spec/check_style.py docs/dal/spec
          python3 docs/dal/spec/check_style.py docs/dalgona/spec
          python3 docs/dal/spec/check_style_test.py
          python3 docs/check_links.py
      - name: Web UI
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
          pnpm -C web exec biome ci
          pnpm -C web exec svelte-check
          pnpm -C web exec vitest run
      - name: Cloudflare worker
        run: |
          pnpm -C deploy/cloudflare install --frozen-lockfile
          pnpm -C deploy/cloudflare exec tsc --noEmit
          pnpm -C deploy/cloudflare exec tsc --noEmit -p tsconfig.test.json
          pnpm -C deploy/cloudflare exec biome ci .
          pnpm -C deploy/cloudflare test
