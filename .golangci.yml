version: "2"

linters:
  default: none
  enable:
    - cyclop
    - depguard
    - dupl
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - gocognit
    - gocritic
    - godox
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
    - wastedassign
  settings:
    gosec:
      excludes:
        - G204
        - G703
        - G304
    cyclop:
      max-complexity: 9
    gocognit:
      min-complexity: 14
    dupl:
      threshold: 150
    exhaustive:
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
    staticcheck:
      checks: ["all", "-ST1000", "-ST1020", "-ST1021", "-ST1022"]
    godox:
      keywords: [TODO, FIXME, XXX, HACK]
    revive:
      rules:
        - name: max-control-nesting
          arguments: [3]
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print
        - pattern: ^print$
        - pattern: ^println$
        - pattern: ^log\.Print
    depguard:
      rules:
        fast:
          files:
            - $all
          deny:
            - pkg: "encoding/json$"
              desc: use encoding/json/v2 and encoding/json/jsontext; v1 reflects slower and copies more
            - pkg: "io/ioutil"
              desc: use io and os
            - pkg: "log$"
              desc: use log/slog
            - pkg: "github.com/sirupsen/logrus"
              desc: slow allocating logger; use log/slog
            - pkg: "github.com/pkg/errors"
              desc: use errors and fmt.Errorf with %w
            - pkg: "github.com/mattn/go-sqlite3"
              desc: cgo driver; use modernc.org/sqlite
            - pkg: "github.com/BurntSushi/toml"
              desc: use github.com/pelletier/go-toml/v2
            - pkg: "gopkg.in/yaml.v2"
              desc: slow reflection decoder; this module has no YAML input
            - pkg: "github.com/gorilla/websocket"
              desc: use github.com/coder/websocket
            - pkg: "nhooyr.io/websocket"
              desc: use github.com/coder/websocket
            - pkg: "github.com/golang/protobuf"
              desc: use google.golang.org/protobuf/encoding/protowire
            - pkg: "google.golang.org/protobuf/proto"
              desc: reflection codec; encode and decode with google.golang.org/protobuf/encoding/protowire
            - pkg: "google.golang.org/protobuf/reflect"
              desc: reflection codec; encode and decode with google.golang.org/protobuf/encoding/protowire
            - pkg: "google.golang.org/protobuf/types"
              desc: reflection codec; encode and decode with google.golang.org/protobuf/encoding/protowire
            - pkg: "github.com/openai/openai-go"
              desc: reflection SDK; speak the provider wire with net/http and encoding/json/jsontext
            - pkg: "github.com/anthropics/anthropic-sdk-go"
              desc: reflection SDK; speak the provider wire with net/http and encoding/json/jsontext
            - pkg: "google.golang.org/genai"
              desc: reflection SDK; speak the provider wire with net/http and encoding/json/jsontext
        syntax:
          files:
            - "!**/internal/dal/syntax/**"
          deny:
            - pkg: "github.com/odvcencio/gotreesitter"
              desc: only internal/dal/syntax imports the tree-sitter library
        copyleft:
          files:
            - $all
          deny:
            - pkg: "github.com/odvcencio/gotreesitter/grammars$"
              desc: the aggregate package embeds the copyleft grammars; import grammars/<name>
            - pkg: "github.com/odvcencio/gotreesitter/grammars/caddy$"
              desc: copyleft grammar under GPL-3.0 per licenses/grammars.json
            - pkg: "github.com/odvcencio/gotreesitter/grammars/disassembly$"
              desc: copyleft grammar under GPL-3.0 per licenses/grammars.json
            - pkg: "github.com/odvcencio/gotreesitter/grammars/jq$"
              desc: copyleft grammar under GPL-3.0 per licenses/grammars.json
            - pkg: "github.com/odvcencio/gotreesitter/grammars/nim$"
              desc: copyleft grammar under MPL-2.0 per licenses/grammars.json
        core:
          files:
            - "**/internal/dal/journal/**"
            - "**/internal/dal/agent/**"
            - "**/internal/dal/model/**"
            - "**/internal/dal/auth/**"
            - "**/internal/dal/tool/**"
            - "**/internal/dal/runner/**"
            - "**/internal/dal/config/**"
            - "**/internal/dal/decide/**"
            - "**/internal/dal/textdiff/**"
            - "**/internal/dal/keywords/**"
            - "**/internal/dal/syntax/**"
            - "**/internal/shellargs/**"
            - "**/internal/secrets/**"
          deny:
            - pkg: "github.com/gosuda/dalgona/internal/acp"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/dal/rpc"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/dal/tui"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/daemon"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/dal/script"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/sandboxsvc"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/mcp"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/discovery"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/webui"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/herdr"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/codexapp"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/ratchet"
              desc: core must not import interfaces or batteries
            - pkg: "github.com/gosuda/dalgona/internal/doctor"
              desc: core must not import interfaces or batteries
        presentation:
          files:
            - "**/internal/dal/app/**"
          deny:
            - pkg: "github.com/gosuda/dalgona/internal/dal/tui"
              desc: presentation depends on core, core never imports presentation
        clients:
          files:
            - "**/internal/dal/tui/**"
            - "**/internal/webui/**"
            - "**/internal/herdr/**"
            - "**/internal/acp/**"
          deny:
            - pkg: "github.com/gosuda/dalgona/internal/dal/journal"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/agent"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/model"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/auth"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/tool"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/runner"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/config"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/decide"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/keywords"
              desc: clients reach the core only through internal/rpc
            - pkg: "github.com/gosuda/dalgona/internal/dal/script"
              desc: clients reach the core only through internal/rpc
        dal:
          files:
            - "**/cmd/dal/**"
          deny:
            - pkg: "github.com/gosuda/dalgona/internal/acp"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/daemon"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/dal/script$"
              desc: dal imports the script engine only through internal/dal/scripthost
            - pkg: "github.com/gosuda/dalgona/internal/sandboxsvc"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/mcp"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/discovery"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/webui"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/herdr"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/codexapp"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/dalgona/battery"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/ratchet"
              desc: dal must stay free of dalgona batteries
            - pkg: "github.com/gosuda/dalgona/internal/doctor"
              desc: dal must stay free of dalgona batteries
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: ^cmd/
        linters: [forbidigo]
      - path: _test\.go
        text: "G301|G306|G404|G703"
        linters: [gosec]

formatters:
  enable:
    - gofumpt
    - goimports
